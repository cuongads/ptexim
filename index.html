<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PTEXIM Brochure</title>
<meta name="theme-color" content="#111111" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<style>
  :root{--bg:#111;--fg:#f2f2f2;--muted:#8c8c8c;--panel:rgba(20,20,20,.78)}
  *{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
  body{background:radial-gradient(circle at 50% 44%,#242424 0,#171717 38%,#101010 75%,#0b0b0b 100%)}
  .app{height:100%;display:grid;grid-template-rows:1fr auto;position:relative}
  .stage{min-height:0;display:flex;align-items:center;justify-content:center;padding:24px 72px 10px;position:relative}
  .book-wrap{width:min(88vw,1320px);height:min(82vh,930px);display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 28px 42px rgba(0,0,0,.48))}
  #book{margin:auto}
  .page{background:#fff;overflow:hidden}.page img{width:100%;height:100%;display:block;object-fit:cover;-webkit-user-drag:none;user-select:none}
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border:1px solid rgba(255,255,255,.13);border-radius:999px;background:rgba(20,20,20,.45);backdrop-filter:blur(12px);color:#fff;display:grid;place-items:center;cursor:pointer;z-index:50;transition:.18s ease}
  .nav:hover{background:rgba(255,255,255,.1);transform:translateY(-50%) scale(1.04)} .nav:disabled{opacity:.2;cursor:default}.prev{left:18px}.next{right:18px}
  .nav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .toolbar{height:58px;display:flex;align-items:center;justify-content:center;gap:18px;padding:0 18px 12px;color:#ddd;font-size:12px;letter-spacing:.03em;z-index:40}
  .counter{min-width:92px;text-align:center;color:#aaa;font-variant-numeric:tabular-nums}
  .tool{border:0;background:transparent;color:#bcbcbc;width:36px;height:36px;border-radius:999px;display:grid;place-items:center;cursor:pointer;transition:.18s}.tool:hover{background:rgba(255,255,255,.07);color:white}.tool svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .zoom-level{min-width:42px;text-align:center;color:#888;font-size:10px;font-variant-numeric:tabular-nums;cursor:pointer}
  #book{transform-origin:center center;will-change:transform}
  .book-wrap.is-zoomed{cursor:grab}
  .book-wrap.is-panning{cursor:grabbing}
  .hint{position:absolute;left:50%;top:18px;transform:translateX(-50%);color:rgba(255,255,255,.42);font-size:11px;letter-spacing:.08em;text-transform:uppercase;pointer-events:none;transition:opacity .5s}
  .loading{position:fixed;inset:0;display:grid;place-items:center;background:#111;z-index:999;transition:opacity .35s,visibility .35s}.loading.hide{opacity:0;visibility:hidden}.spinner{width:26px;height:26px;border-radius:50%;border:2px solid #333;border-top-color:#aaa;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .error{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:30px;color:#bbb;background:#111;z-index:1000;line-height:1.6}.error b{color:#fff}
  @media(max-width:800px){
  .stage{padding:12px 4px 4px;align-items:center}
  .book-wrap{width:100vw;height:calc(100vh - 64px);max-width:none;max-height:none;overflow:hidden;touch-action:none}
  #book{margin:auto}
  .nav{display:none}
  .toolbar{height:52px;padding:0 4px 8px;gap:5px}
  .hint{top:7px;font-size:9px}
  .counter{min-width:76px}
  .tool{width:29px;height:29px}
  .zoom-level{min-width:34px;font-size:9px}
}
</style>
</head>
<body>
<div class="app">
  <main class="stage">
    <div class="hint" id="hint">Drag the page corner to turn</div>
    <button class="nav prev" id="prev" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="book-wrap"><div id="book"></div></div>
    <button class="nav next" id="next" aria-label="Next page"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </main>
  <footer class="toolbar">
    <button class="tool" id="first" aria-label="First page"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 5l-7 7 7 7"/></svg></button>
    <button class="tool" id="back" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="counter" id="counter">01 / 34</div>
    <button class="tool" id="forward" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="tool" id="last" aria-label="Last page"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 5l7 7-7 7"/></svg></button>
    <button class="tool" id="zoomOut" aria-label="Zoom out"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M8 11h6M16 16l4 4"/></svg></button>
    <div class="zoom-level" id="zoomLevel" title="Tap to reset zoom">100%</div>
    <button class="tool" id="zoomIn" aria-label="Zoom in"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M8 11h6M11 8v6M16 16l4 4"/></svg></button>
    <button class="tool" id="fullscreen" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>
  </footer>
</div>
<div class="loading" id="loading"><div class="spinner"></div></div>
<div class="error" id="error"><div><b>Unable to start flipbook.</b><br>Please check your internet connection once so the page-turn library can load.</div></div>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
(() => {
  const TOTAL=34;
  const loading=document.getElementById('loading');
  const error=document.getElementById('error');
  if(!window.St || !St.PageFlip){ loading.classList.add('hide'); error.style.display='grid'; return; }

  const book=document.getElementById('book');
  for(let i=1;i<=TOTAL;i++){
    const page=document.createElement('div'); page.className='page';
    const img=document.createElement('img');
    img.src=`pages/page-${String(i).padStart(2,'0')}.webp`;
    img.alt=`PTEXIM brochure page ${i}`;
    img.loading=i<=4?'eager':'lazy'; img.decoding='async';
    page.appendChild(img); book.appendChild(page);
  }

  const isMobile=window.matchMedia('(max-width:800px)').matches;
  const PAGE_RATIO=990/700;
  const mobilePageWidth=Math.max(110,Math.floor((window.innerWidth-12)/2));
  const mobilePageHeight=Math.round(mobilePageWidth*PAGE_RATIO);

  const pf=new St.PageFlip(book,isMobile ? {
    width:mobilePageWidth,
    height:mobilePageHeight,
    size:'fixed',
    maxShadowOpacity:.42,
    showCover:true,
    mobileScrollSupport:false,
    usePortrait:false,
    autoSize:false,
    drawShadow:true,
    flippingTime:820,
    startZIndex:0,
    showPageCorners:true,
    disableFlipByClick:false
  } : {
    width:700,height:990,size:'stretch',minWidth:300,maxWidth:700,minHeight:424,maxHeight:990,
    maxShadowOpacity:.42,showCover:true,mobileScrollSupport:false,usePortrait:false,autoSize:true,
    drawShadow:true,flippingTime:820,startZIndex:0,showPageCorners:true,disableFlipByClick:false
  });
  pf.loadFromHTML(document.querySelectorAll('.page'));

  // Keep a true two-page spread on mobile. Rebuild on orientation change so
  // the fixed page size is recalculated for the new viewport width.
  if(isMobile){
    window.addEventListener('orientationchange',()=>setTimeout(()=>location.reload(),150));
  }


  // Zoom & pan
  const bookWrap=document.querySelector('.book-wrap');
  const zoomInBtn=document.getElementById('zoomIn');
  const zoomOutBtn=document.getElementById('zoomOut');
  const zoomLevelEl=document.getElementById('zoomLevel');
  const MIN_ZOOM=1, MAX_ZOOM=3, ZOOM_STEP=.25;
  let zoom=1, panX=0, panY=0;
  let pinchStartDistance=0, pinchStartZoom=1;
  let panStartX=0, panStartY=0, panOriginX=0, panOriginY=0;
  let isPanning=false;

  const clamp=(v,min,max)=>Math.min(max,Math.max(min,v));

  function applyZoom(){
    if(zoom<=1.001){ zoom=1; panX=0; panY=0; }
    book.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;
    bookWrap.classList.toggle('is-zoomed',zoom>1);
    zoomLevelEl.textContent=`${Math.round(zoom*100)}%`;
    zoomOutBtn.disabled=zoom<=MIN_ZOOM;
    zoomInBtn.disabled=zoom>=MAX_ZOOM;
  }

  function setZoom(next){
    zoom=clamp(Math.round(next*100)/100,MIN_ZOOM,MAX_ZOOM);
    applyZoom();
  }

  zoomInBtn.onclick=()=>setZoom(zoom+ZOOM_STEP);
  zoomOutBtn.onclick=()=>setZoom(zoom-ZOOM_STEP);
  zoomLevelEl.onclick=()=>setZoom(1);

  function touchDistance(t1,t2){
    return Math.hypot(t2.clientX-t1.clientX,t2.clientY-t1.clientY);
  }

  bookWrap.addEventListener('touchstart',e=>{
    if(e.touches.length===2){
      e.preventDefault();
      e.stopPropagation();
      pinchStartDistance=touchDistance(e.touches[0],e.touches[1]);
      pinchStartZoom=zoom;
      isPanning=false;
    } else if(e.touches.length===1 && zoom>1){
      e.preventDefault();
      e.stopPropagation();
      isPanning=true;
      bookWrap.classList.add('is-panning');
      panStartX=e.touches[0].clientX;
      panStartY=e.touches[0].clientY;
      panOriginX=panX;
      panOriginY=panY;
    }
  },{passive:false,capture:true});

  bookWrap.addEventListener('touchmove',e=>{
    if(e.touches.length===2){
      e.preventDefault();
      e.stopPropagation();
      const d=touchDistance(e.touches[0],e.touches[1]);
      if(pinchStartDistance){
        zoom=clamp(pinchStartZoom*(d/pinchStartDistance),MIN_ZOOM,MAX_ZOOM);
        applyZoom();
      }
    } else if(e.touches.length===1 && zoom>1 && isPanning){
      e.preventDefault();
      e.stopPropagation();
      panX=panOriginX+(e.touches[0].clientX-panStartX);
      panY=panOriginY+(e.touches[0].clientY-panStartY);
      applyZoom();
    }
  },{passive:false,capture:true});

  bookWrap.addEventListener('touchend',e=>{
    if(e.touches.length<2) pinchStartDistance=0;
    if(e.touches.length===0){
      isPanning=false;
      bookWrap.classList.remove('is-panning');
    }
  },{passive:false,capture:true});

  applyZoom();

  const counter=document.getElementById('counter');
  const prev=document.getElementById('prev'), next=document.getElementById('next');
  const back=document.getElementById('back'), forward=document.getElementById('forward');
  const pad=n=>String(n).padStart(2,'0');
  function update(i=pf.getCurrentPageIndex()){
    const p=Math.min(TOTAL,i+1); counter.textContent=`${pad(p)} / ${TOTAL}`;
    const atStart=i<=0, atEnd=i>=TOTAL-1;
    prev.disabled=back.disabled=atStart; next.disabled=forward.disabled=atEnd;
  }
  pf.on('init',e=>{update(e.data.page);loading.classList.add('hide');setTimeout(()=>document.getElementById('hint').style.opacity='0',3500)});
  pf.on('flip',e=>update(e.data));
  prev.onclick=back.onclick=()=>pf.flipPrev(); next.onclick=forward.onclick=()=>pf.flipNext();
  document.getElementById('first').onclick=()=>pf.turnToPage(0); document.getElementById('last').onclick=()=>pf.turnToPage(TOTAL-1);
  document.getElementById('fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')pf.flipNext();if(e.key==='ArrowLeft'||e.key==='PageUp')pf.flipPrev();if(e.key==='Home')pf.turnToPage(0);if(e.key==='End')pf.turnToPage(TOTAL-1)});
})();
</script>
</body>
</html>
